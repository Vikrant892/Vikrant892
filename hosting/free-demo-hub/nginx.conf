worker_processes 1;
pid /tmp/free-demo-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log /dev/stdout;
  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
  server {
    listen 7860;
    client_max_body_size 16m;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding '';
    location = /_hosting/prefix.js { alias /opt/hosting/prefix.js; default_type application/javascript; }
    location = /demos/fraud { return 308 /demos/fraud/; }
    location = /demos/logs { return 308 /demos/logs/; }
    location = /demos/password { return 308 /demos/password/; }
    location = /demos/phishing { return 308 /demos/phishing/; }
    location /demos/fraud/ { proxy_pass http://127.0.0.1:8502; }
    location /demos/logs/ {
      proxy_pass http://127.0.0.1:8503;
      sub_filter_once on;
      sub_filter '<head>' '<head><script src="/_hosting/prefix.js" data-prefix="/demos/logs"></script>';
    }
    location /demos/password/ {
      proxy_pass http://127.0.0.1:8504;
      sub_filter_once on;
      sub_filter '<head>' '<head><script src="/_hosting/prefix.js" data-prefix="/demos/password"></script>';
    }
    location /demos/phishing/ {
      proxy_pass http://127.0.0.1:8505;
      sub_filter_once on;
      sub_filter '<head>' '<head><script src="/_hosting/prefix.js" data-prefix="/demos/phishing"></script>';
    }
    location / { proxy_pass http://127.0.0.1:8501; }
  }
}
