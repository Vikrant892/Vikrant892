[supervisord]
logfile=/tmp/free-demo-supervisor.log
pidfile=/tmp/free-demo-supervisor.pid
childlogdir=/tmp
nodaemon=true

[program:gateway]
command=nginx -c /opt/hosting/nginx.conf -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nasa]
directory=/opt/apps/nasa-space-challenge
command=/opt/venvs/nasa-space-challenge/bin/streamlit run app.py --server.port=8501 --server.address=127.0.0.1 --server.headless=true --server.enableXsrfProtection=false
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fraud]
directory=/opt/apps/credit-card-fraud-detection
command=/opt/venvs/credit-card-fraud-detection/bin/streamlit run app.py --server.port=8502 --server.address=127.0.0.1 --server.headless=true --server.enableXsrfProtection=false --server.baseUrlPath=demos/fraud
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:logs]
directory=/opt/apps/log-analyzer-dashboard
environment=DEMO_PREFIX="/demos/logs",DEMO_MODULE="app"
command=/opt/venvs/log-analyzer-dashboard/bin/gunicorn --pythonpath /opt/hosting --bind 127.0.0.1:8503 --workers 1 --timeout 120 wsgi_adapter:application
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:password]
directory=/opt/apps/password-strength-api
command=/opt/venvs/password-strength-api/bin/uvicorn asgi_adapter:application --app-dir /opt/hosting --host 127.0.0.1 --port 8504
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:phishing]
directory=/opt/apps/phishing-detection-platform/python
environment=DEMO_PREFIX="/demos/phishing",DEMO_MODULE="simple_app",SQLITE_PATH="/opt/apps/phishing-detection-platform/data/phishing.sqlite",ALLOWED_ORIGINS="*"
command=/opt/venvs/phishing-detection-platform/bin/gunicorn --pythonpath /opt/hosting --bind 127.0.0.1:8505 --workers 1 --timeout 120 wsgi_adapter:application
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
