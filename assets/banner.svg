  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b0f" />
      <stop offset="50%" stop-color="#0f1b3d" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0">
