name: Rehost free demos

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check existing hosting access or verify and deploy the shared free server
        type: choice
        options: [check-access, deploy]
        default: check-access

permissions:
  contents: read

concurrency:
  group: rehost-free-demos
  cancel-in-progress: false

jobs:
  rehost:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check existing hosting access without changing the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          token = os.environ.get('HF_TOKEN', '')
          if not token:
              raise SystemExit('HF_TOKEN is not configured; no hosting changes made.')
          request = urllib.request.Request(
              'https://huggingface.co/api/spaces/vikrant892/nasa-space-challenge/preupload/main',
              data=b'{"files": []}',
              headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.load(response)
                  assert data.get('files') == [], 'Unexpected preflight response'
          except urllib.error.HTTPError as error:
              raise SystemExit(f'Existing hosting credential denied file-upload access (HTTP {error.code}); no changes made.')
          print('Existing credential can upload deployment files. No files or settings changed by this check.')
          PY
      - name: Prepare hosting-only package
        if: inputs.mode == 'deploy'
        run: python hosting/free-demo-hub/package.py /tmp/free-demo-package
      - name: Build the shared server
        if: inputs.mode == 'deploy'
        run: docker build -t free-demo-hub /tmp/free-demo-package
      - name: Verify applications before deployment
        if: inputs.mode == 'deploy'
        run: |
          docker run -d --name free-demo-hub --memory=2g --cpus=2 -p 127.0.0.1:7860:7860 free-demo-hub
          python hosting/free-demo-hub/verify.py http://127.0.0.1:7860
          docker exec free-demo-hub python - <<'PY'
          import json, pathlib, hashlib
          root = pathlib.Path('/opt/apps')
          checksums = json.loads((root / 'source-checksums.json').read_text())
          for app, files in checksums.items():
              for filename, checksum in files.items():
                  assert hashlib.sha256((root / app / filename).read_bytes()).hexdigest() == checksum, (app, filename)
          print('Every copied application file is unchanged after verification.')
          PY
      - name: Verify browser requests and Streamlit WebSockets
        if: inputs.mode == 'deploy'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python hosting/free-demo-hub/browser_verify.py http://127.0.0.1:7860
      - name: Publish hosting files and verify the live demos
        if: inputs.mode == 'deploy'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install huggingface_hub==0.34.4
          python hosting/free-demo-hub/deploy.py /tmp/free-demo-package
      - name: Save verification logs
        if: always() && inputs.mode == 'deploy'
        run: |
          docker logs free-demo-hub > /tmp/free-demo-server.log 2>&1 || true
          docker inspect free-demo-hub --format '{{json .State}}' || true
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'deploy'
        with:
          name: free-demo-verification
          path: /tmp/free-demo-server.log
